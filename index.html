<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aubergine Quin | Ideas </title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero">
    <div class="wordmark">
      <h1 class="wordmark__name" id="title">
        <span class="visually-hidden">Aubergine Quin</span>
      </h1>
      <label class="wordmark__stop" title="Change colour">
        <span class="visually-hidden">Font colour</span>
        <input type="color" id="font-colour" value="#490a54" />
      </label>
    </div>

    <nav class="contact contact--google" aria-label="Contact">
      <a class="contact__button" href="mailto:auberginequin@gmail.com">Email me</a>
      <a
        class="contact__button"
        href="mailto:auberginequin@gmail.com?subject=%28Unbelieveable%20work%20opportunity%21%21%20unlimited%20budget%21%21%20deliverables%20optional%21%21%29&amp;body=Name%20your%20price%21%21"
      >I'm Feeling Lucky</a>
    </nav>
  </main>

  <footer class="colour-footer">
    <span class="colour-footer__email-wrap" data-tooltip="Copy to clipboard">
      <button
        class="colour-footer__email"
        id="copy-email"
        type="button"
        data-email="auberginequin@gmail.com"
        aria-label="Copy auberginequin@gmail.com to clipboard"
      ></button>
    </span>
    <span class="visually-hidden" id="copy-email-status" aria-live="polite"></span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
